    <h1 class="title">Prayers for You</h1>
    <p>When words are hard to find, let God's Word be your prayer.</p>

    <figure>
      <figcaption>“You will seek me and find me when you seek me with all your heart.” – Jeremiah 29:13</figcaption>
      <table>
        <thead>
          <tr>
            <th>Topic</th>
            <th>Bible Verse</th>
            <th>Prayer</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Seeking God</td>
            <td class="verse">“You will seek me and find me when you seek me with all your heart.” (Jeremiah 29:13)</td>
            <td class="prayer">Lord, help me seek you wholeheartedly.</td>
          </tr>
          <tr>
            <td>Faith</td>
            <td class="verse">“Now faith is the assurance of things hoped for, the conviction of things not seen.” (Hebrews 11:1)</td>
            <td class="prayer">Lord, strengthen my faith even when I cannot see the way forward.</td>
          </tr>
          <tr>
            <td>Strength</td>
            <td class="verse">“I can do all things through him who strengthens me.” (Philippians 4:13)</td>
            <td class="prayer">Lord, fill me with your strength to face every challenge.</td>
          </tr>
          <tr>
            <td>Peace</td>
            <td class="verse">“Peace I leave with you; my peace I give you.” (John 14:27)</td>
            <td class="prayer">Lord, grant me your peace that surpasses all understanding.</td>
          </tr>
          <tr>
            <td>Guidance</td>
            <td class="verse">“Trust in the Lord with all your heart and lean not on your own understanding.” (Proverbs 3:5)</td>
            <td class="prayer">Lord, guide my steps and help me trust in your wisdom.</td>
          </tr>
        </tbody>
      </table>
